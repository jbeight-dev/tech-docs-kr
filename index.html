<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Docs KR</title>
<meta name="description" content="해외 기술 문서의 한국어 번역 아카이브">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/css/site.css">
<script>
  // 번역 문서와 같은 규칙·저장 키로 렌더 전에 테마 적용
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<script src="assets/js/doc-list.js" defer></script>
<script src="assets/js/site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <span class="brand">Tech Docs KR</span>
    <button id="theme-toggle" class="icon-button" type="button" aria-label="테마 전환" title="테마 전환">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>
  <main>
    <h1>기술 문서 한국어 모음</h1>
    <p class="lead">해외 기술 문서를 한국어로 모아 검색하고 읽는 공간입니다.</p>
    <form id="filters" role="search">
      <label for="q">문서 검색</label>
      <input id="q" type="search" placeholder="문서 제목, 설명, 태그 검색" autocomplete="off">
      <div id="categories" role="group" aria-label="프로젝트"></div>
    </form>
    <div class="toolbar">
      <p id="status" role="status"></p>
      <div id="sort-control" hidden>
        <select id="sort" aria-label="정렬 기준">
          <option value="translated">최근 번역순</option>
          <option value="title">제목순</option>
        </select>
      </div>
    </div>
    <ul id="docs"></ul>
    <div id="empty" hidden>
      <p>검색 결과가 없습니다</p>
      <button id="reset" type="button">검색어·필터 초기화</button>
    </div>
    <noscript><p>문서 목록을 보려면 JavaScript를 켜 주세요.</p></noscript>
  </main>
  <footer>각 번역의 저작권과 라이선스는 원문을 따릅니다.</footer>
</body>
</html>
